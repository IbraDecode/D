name: Desktop Environment

on:
  workflow_dispatch:
    inputs:
      selected_os:
        description: 'Target OS'
        required: true
        default: 'windows-latest'
        type: choice
        options:
          - windows-latest
          - ubuntu-latest

      username:
        description: 'Username'
        required: true
        default: 'cloudadmin'

      target_repo:
        description: 'Public repository URL (optional)'
        required: false
        default: ''

jobs:
  provision-windows:
    name: Provision Windows
    if: startsWith(github.event.inputs.selected_os, 'windows')
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Windows provisioning script
        env:
          RDP_USER: ${{ github.event.inputs.username }}
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
        run: powershell -ExecutionPolicy Bypass -File ./scripts/core-windows.ps1

  provision-linux:
    name: Provision Linux
    if: github.event.inputs.selected_os == 'ubuntu-latest'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Linux provisioning script
        env:
          RDP_USER: ${{ github.event.inputs.username }}
          RDP_PASS: ${{ secrets.RDP_PASSWORD }}
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
        run: |
          chmod +x ./scripts/core-linux.sh
          ./scripts/core-linux.sh
